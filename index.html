<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kriti Gupta - Portfolio</title>
    
    <script src="https://unpkg.com/lucide@0.475.0/dist/umd/lucide.min.js"></script>

    <style>
        /* Base styles matching your modern dark theme layout */
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            text-align: center;
            max-width: 800px;
            margin-bottom: 30px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        /* Social Button Containers */
        .cta-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        /* Circular Social Icon Wrapper */
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #161b22;
            border: 1px solid #30363d;
            color: #8b949e;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            color: #58a6ff;
            border-color: #58a6ff;
            background-color: #21262d;
        }

        /* Let's Talk CTA Button */
        .talk-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            height: 45px;
            border-radius: 23px;
            background: linear-gradient(135deg, #1f40aa, #162a70);
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(31, 64, 170, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .talk-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(31, 64, 170, 0.4);
        }

        /* Optional Lucide Icon sizing adjustment */
        .social-btn i, .social-btn svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>KRITI GUPTA</h1> [cite: 2]
        <div class="subtitle">Business Analyst & Software Engineer</div> [cite: 5, 23]
        
        <div class="cta-container">
            <!-- <a href="https://github.com" target="_blank" class="social-btn" aria-label="GitHub">
                <i data-lucide="github"></i>
            </a>

            <a href="https://linkedin.com" target="_blank" class="social-btn" aria-label="LinkedIn">
                <i data-lucide="linkedin"></i>
            </a> -->

            <a href="mailto:kritigupta0613@gmail.com" class="talk-btn">LET'S TALK</a> 
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            } else {
                console.error("Lucide library failed to load via CDN.");
            }
        });
    </script>
</body>
</html>
